<!doctype html>
<html lang="pt-BR" data-theme="auto">
  <head>
    <!-- Objetivo: shell HTML semântico da aplicação. Responsabilidade: expor landmarks, pontos de montagem e metadados PWA/SEO. Dependências: CSS global, manifest, favicon e assets/js/app.js. -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Gerador PWA de assinaturas de e-mail da OBJETIVONET." />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OBJETIVONET Email Signature Generator" />
    <meta property="og:description" content="Fundação PWA para criação de assinaturas de e-mail." />
    <meta property="og:image" content="assets/icons/icon-512.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="OBJETIVONET Email Signature Generator" />
    <meta name="twitter:description" content="Fundação PWA para criação de assinaturas de e-mail." />
    <title>OBJETIVONET Email Signature Generator</title>
    <link rel="icon" href="assets/icons/icon-192.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/themes.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/utilities.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Ir para o conteúdo principal</a>
    <div id="app" class="app-shell" data-state="booting">
      <header class="app-header" role="banner" data-component="Header">
        <div><strong>OBJETIVONET</strong><span>Email Signature Generator</span></div>
        <nav aria-label="Ações principais"><button type="button" id="theme-toggle" class="button">Tema</button></nav>
      </header>
      <aside class="app-sidebar" aria-label="Navegação de módulos" data-component="Sidebar">
        <nav><a href="#editor" data-route="editor">Editor</a><a href="#preview" data-route="preview">Preview</a><a href="#code" data-route="code">Código</a></nav>
      </aside>
      <main id="main-content" class="app-main" tabindex="-1">
        <section id="editor" class="panel" aria-labelledby="editor-title" data-component="Editor"><h1 id="editor-title">Editor</h1><p>Área preparada para os campos da assinatura.</p></section>
        <section id="preview" class="panel" aria-labelledby="preview-title" data-component="Preview"><h2 id="preview-title">Preview</h2><div class="placeholder" role="status">Preview será implementado na fase futura.</div></section>
        <section id="code" class="panel" aria-labelledby="code-title" data-component="CodeViewer"><h2 id="code-title">Code Viewer</h2><pre aria-live="polite"><code>&lt;!-- HTML gerado será exibido em fase futura. --&gt;</code></pre></section>
      </main>
      <footer class="app-footer" role="contentinfo" data-component="Footer"><small>&copy; 2026 OBJETIVONET</small></footer>
    </div>
    <div id="modal-root" aria-live="polite"></div><div id="toast-root" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
